
<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Thank You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
  
    <div class="stars" id="stars"></div>

    <!-- First Screen -->
    <section class="screen" id="firstScreen">
        <h1>A Little Surprise ✨</h1>
        <p>You have a special message waiting...</p>

        <div class="envelope" id="envelope">
            <div class="letter">
                <span>💌</span>
            </div>
            <div class="flap"></div>
        </div>
 
        <button id="openBtn">Open My Letter 💌</button>
    </section>

    <!-- Name Screen -->
    <section class="screen hidden" id="nameScreen">
        <div class="card">
            <h1>Hey There! ✨</h1>
            <p>Before I reveal my message, tell me your name.</p>

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name..."
                maxlength="50"
                autocomplete="off"
            >

            <p id="errorMessage"></p>

            <button id="surpriseBtn">Reveal Surprise 💖</button>
        </div>
    </section>

    <!-- Thank You Screen -->
    <section class="screen hidden" id="thankScreen">
        <div class="card final-card">

            <h1 id="thankHeading">Thank You ❤️</h1>

            <p class="message">
                Thank you for making my birthday
                a little more special with your wishes.
            </p>

            <p class="ending">
                Your kindness means a lot! ✨
            </p>
 
            <a
                id="welcomeBtn"
                class="whatsapp-btn"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >
                Send Welcome 👋
            </a>

            <button id="replayBtn" class="replay-btn">
                Replay ↻
            </button>

        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
